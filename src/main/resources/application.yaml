server:
  port : 8081
spring:
  datasource:
    url: "jdbc:sqlite:core0.db"
  flyway:
    url: "jdbc:sqlite:core0.db"
  jpa:
    database-platform: "org.hibernate.community.dialect.SQLiteDialect"
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
logging:
    level:
      root: INFO
